# ==============================================================================
# 1. Namespace
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: demo-eda
---
# ==============================================================================
# 2. ConfigMap
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: eda-config
  namespace: demo-eda
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  TOPIC_TX_RECEIVED: "tx-received"
  TOPIC_TX_EVALUATED: "tx-evaluated"
---
# ==============================================================================
# 3. Apache Kafka (KRaft Mode)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: demo-eda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - containerPort: 9092
              name: client
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-service:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: demo-eda
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
      name: client
---
# ==============================================================================
# 4. Quarkus Core Transaction API
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: demo-eda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
        - name: transaction-service
          image: event-driven-demo-transaction-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: eda-config
                  key: KAFKA_BOOTSTRAP_SERVERS
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: demo-eda
spec:
  type: LoadBalancer
  selector:
    app: transaction-service
  ports:
    - port: 8080
      targetPort: 8080
---
# ==============================================================================
# 5. Python Fraud Detection Engine
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detector
  namespace: demo-eda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-detector
  template:
    metadata:
      labels:
        app: fraud-detector
    spec:
      containers:
        - name: fraud-detector
          image: event-driven-demo-fraud-detector:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: eda-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: INPUT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: eda-config
                  key: TOPIC_TX_RECEIVED
            - name: OUTPUT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: eda-config
                  key: TOPIC_TX_EVALUATED
            - name: KAFKA_GROUP_ID
              value: "k8s-fraud-detection-service"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
# ==============================================================================
# 6. Go Audit & Notification Worker
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-worker
  namespace: demo-eda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-worker
  template:
    metadata:
      labels:
        app: audit-worker
    spec:
      containers:
        - name: audit-worker
          image: event-driven-demo-audit-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: eda-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: INPUT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: eda-config
                  key: TOPIC_TX_EVALUATED
            - name: KAFKA_GROUP_ID
              value: "k8s-audit-notification-group"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
